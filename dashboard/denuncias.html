<script>
/* Denuncias anónimas del personal: las reciben Recursos Humanos (permiso «rrhh») y Dirección, con el usuario del ERP
   de Bolivia o de Paraguay. Quien denuncia no entra acá: usa denuncia.html, sin usuario. */
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    var t = s.tableros.concat(s.tableros_py || []);
    if (!["rrhh", "direccion"].some(function (x) { return t.indexOf(x) >= 0; })) { location.replace("./?sin=rrhh"); return; }
    window.CM_USUARIO = s;
})();
</script>
