<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Capital Corp · Asistente</title>
<link rel="icon" href="../images/132458707.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Saira:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="pais.js?v=2"></script>
<script src="cm-mcp.js?v=3"></script>
<script src="py-datos.js?v=2"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=2"></script>
<script>window.CM_FB_SIN_BARRA = true;</script>
<script src="cm-firebase.js?v=11"></script>
<script>
/* Pantalla central del muro: hay que haber ingresado al portal con un usuario del ERP con permiso del muro (o Dirección)
   y tener la sesión de datos de Calistenia. */
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    if (s.tableros.indexOf("muro") < 0 && s.tableros.indexOf("direccion") < 0) { location.replace("./?sin=muro"); return; }
    window.CM_USUARIO = s;
    if (!window.CM.conSesion()) { window.CM.iniciarSesion(location.pathname.split("/").pop() + location.hash); }
})();
</script>
<style>
:root { --b: #FFFFFF; --m: #9A9A9A; --l: #1E1E1E; --ok: #7FD1A8; --warn: #F0C987; --bad: #E8857D; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #000; color: var(--b); font-family: "Saira", "Segoe UI", Roboto, Arial, sans-serif; }
body { overflow: hidden; }
.as { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(16px, 2.2vw, 40px); gap: clamp(10px, 1.6vh, 24px); }
.as-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.as-marca { display: inline-flex; align-items: center; }
.as-marca img { display: none; height: clamp(28px, 4vh, 54px); width: auto; }
.as-marca.con-img img { display: block; } .as-marca.con-img .as-txt { display: none; }
.as-txt { font-family: "Russo One", "Arial Black", sans-serif; text-transform: uppercase; letter-spacing: .32em; font-size: clamp(16px, 1.6vw, 28px); }
.as-reloj { text-align: right; color: var(--m); font-size: clamp(12px, 1vw, 18px); letter-spacing: .08em; text-transform: uppercase; }
.as-reloj b { display: block; color: var(--b); font-family: "Russo One", sans-serif; font-weight: 400; font-size: clamp(22px, 2.4vw, 44px); letter-spacing: .04em; }
.as-centro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 30%); gap: clamp(16px, 2vw, 40px); min-height: 0; }
.as-voz { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 2.4vh, 32px); min-height: 0; text-align: center; }
.as-anillo { position: relative; width: min(46vh, 34vw); aspect-ratio: 1; }
.as-anillo canvas { width: 100%; height: 100%; display: block; }
.as-estado { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(11px, .9vw, 16px); letter-spacing: .3em; text-transform: uppercase; color: var(--m); pointer-events: none; }
.as-dice { max-width: 46ch; min-height: 3.2em; margin: 0; font-weight: 300; font-size: clamp(18px, 1.7vw, 34px); line-height: 1.35; }
.as-oye { min-height: 1.4em; margin: 0; color: var(--m); font-size: clamp(13px, 1vw, 20px); font-style: italic; }
.as-panel { border-left: 1px solid var(--l); padding-left: clamp(14px, 1.6vw, 32px); display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 18px); min-height: 0; overflow: hidden; }
.as-panel h2 { margin: 0; font-size: clamp(11px, .85vw, 15px); letter-spacing: .26em; text-transform: uppercase; color: var(--m); font-weight: 500; }
.as-kpi { display: flex; flex-direction: column; gap: 2px; padding-bottom: clamp(6px, 1vh, 14px); border-bottom: 1px solid var(--l); }
.as-kpi span { color: var(--m); font-size: clamp(11px, .85vw, 15px); text-transform: uppercase; letter-spacing: .1em; }
.as-kpi b { font-family: "Russo One", sans-serif; font-weight: 400; font-size: clamp(20px, 2vw, 38px); }
.as-kpi small { color: var(--m); font-size: clamp(11px, .8vw, 14px); }
.as-kpi.is-warn b { color: var(--warn); } .as-kpi.is-bad b { color: var(--bad); } .as-kpi.is-ok b { color: var(--ok); }
.as-pie { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.as-pie form { display: flex; gap: 8px; flex: 1 1 380px; max-width: 720px; }
.as-pie input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--b); background: #0A0A0A; border: 1px solid #2A2A2A; padding: 10px 12px; border-radius: 0; }
.as-pie input:focus-visible { outline: 1px solid var(--b); }
.as-btn { font: inherit; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--b); background: none; border: 1px solid #3A3A3A; padding: 10px 16px; cursor: pointer; white-space: nowrap; }
.as-btn:hover, .as-btn:focus-visible { border-color: var(--b); outline: none; }
.as-btn.is-on { background: var(--b); color: #000; border-color: var(--b); }
.as-modo { width: 100%; text-align: center; margin: 0; color: #6E6E6E; font-size: 12px; }
.as-aviso { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 5; margin: 0; max-width: min(92vw, 760px); padding: 10px 16px; background: #111; border: 1px solid #3A3A3A; color: #E6E6E6; font-size: 14px; text-align: center; }
.as-volver { color: var(--m); font-size: 13px; text-decoration: none; letter-spacing: .08em; text-transform: uppercase; }
.as-volver:hover { color: var(--b); }
@media (max-width: 820px) {
  body { overflow: auto; }
  .as { height: auto; min-height: 100dvh; }
  .as-centro { grid-template-columns: 1fr; }
  .as-panel { border-left: 0; border-top: 1px solid var(--l); padding: 14px 0 0; }
  .as-anillo { width: min(70vw, 340px); }
}
@media (prefers-reduced-motion: reduce) { .as-anillo canvas { animation: none; } }
</style>
</head>
<body>
<main class="as" id="as">
  <header class="as-top">
    <span class="as-marca"><img src="../images/capital-corp-logo.png" alt="Capital Corp" onload="this.parentNode.classList.add('con-img')" onerror="this.remove()"><span class="as-txt">Capital Corp</span></span>
    <div class="as-reloj"><b id="as-hora">--:--</b><span id="as-fecha"></span></div>
  </header>

  <section class="as-centro">
    <div class="as-voz">
      <div class="as-anillo"><canvas id="as-canvas" aria-hidden="true"></canvas><div class="as-estado" id="as-estado">En espera</div></div>
      <p class="as-dice" id="as-dice" aria-live="polite"></p>
      <p class="as-oye" id="as-oye"></p>
    </div>
    <aside class="as-panel" aria-label="Lo que hay que atender hoy">
      <h2>Para atender hoy · Bolivia</h2>
      <div id="as-kpis"><p class="as-oye">Leyendo los datos del día…</p></div>
    </aside>
  </section>

  <footer class="as-pie">
    <button type="button" class="as-btn" id="as-mic" hidden>Activar micrófono</button>
    <form id="as-form" autocomplete="off"><input id="as-texto" placeholder="Escriba su pregunta…" aria-label="Pregunta para Capital Corp" maxlength="400"><button type="submit" class="as-btn">Enviar</button></form>
    <button type="button" class="as-btn" id="as-full">Pantalla completa</button>
    <a class="as-volver" href="./">Centro de mando</a>
    <p class="as-modo" id="as-modo"></p>
  </footer>
</main>

<p class="as-aviso" id="as-aviso" role="status" hidden></p>

<script src="asistente.js?v=10"></script>
<script src="kiosco/configurar.js?v=3"></script>
</body>
</html>
