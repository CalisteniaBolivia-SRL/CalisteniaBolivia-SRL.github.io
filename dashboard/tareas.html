<script>
/* Tareas de Administración: las cargan y siguen Administración y Dirección. Siempre con el usuario del ERP, de Bolivia o de Paraguay. */
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    var t = s.tableros.concat(s.tableros_py || []);
    if (!["administracion", "direccion"].some(function (x) { return t.indexOf(x) >= 0; })) { location.replace("./?sin=administracion"); return; }
    window.CM_USUARIO = s;
})();
</script>

<div class="cm-barra"><a href="./">← Centro de mando</a><a href="manual.html#tareas">Manual</a><span class="cm-quien" id="cm-quien"></span><button type="button" id="cm-salir">Salir</button></div>

<main class="op" lang="es">
  <header class="op-top">
    <div>
      <span class="op-eyebrow" id="op-eyebrow">Calistenia Company · Administración y Dirección</span>
      <h1 class="op-titulo">Tareas de Administración</h1>
      <p class="op-muted">Lo que hay por hacer, ordenado por prioridad. El administrador carga y marca lo que se hizo; Dirección lo ve, comenta y decide. Así coordinan en un solo lugar.</p>
    </div>
    <div class="op-herr"><button type="button" class="op-btn is-fuerte" id="tk-nueva">+ Nueva tarea</button></div>
  </header>
  <p class="op-msg" id="op-estado" role="status" aria-live="polite">Cargando…</p>
