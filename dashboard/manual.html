  <h1>Manual de uso</h1>
  <p class="mn-lede" id="mn-lede">Lo que corresponde a tu perfil del ERP. Cada perfil del ERP (rol con permisos en la página /centro_mando) tiene su parte del manual; si te cambian el perfil, esta página cambia sola.</p>

<script>
(function () {
  "use strict";
  var BASE = "https://calisteniabolivia-srl.github.io/dashboard/manual.html";
  /* Una sección por perfil del ERP. «permisos»: permisos de /centro_mando que la muestran. «rol»: nombre sugerido del rol en el ERP. */
  var M = [
    { id: "todos", titulo: "Para todos", rol: null, permisos: null, html:
      '<h3>Entrar</h3><ol><li>Abrí <b>calisteniabolivia-srl.github.io/dashboard</b> y entrá con tu <b>mismo usuario y contraseña del ERP</b>. No hay usuarios aparte.</li><li>Ves solo los tableros de tu perfil. Si no te aparece algo que necesitás, pedí a Dirección que revise tu rol en el ERP.</li><li>Después de un cambio de rol: tocá <b>Salir</b> y volvé a entrar.</li></ol>' +
      '<h3>La app en el celular</h3><ul><li><b>Android</b>: abrí <b>calisteniabolivia-srl.github.io/dashboard/app</b>, tocá <b>Descargar la app</b> e instalala (la primera vez el teléfono pide permitir apps de origen desconocido).</li><li><b>iPhone</b>: en Safari, Compartir → <b>Agregar a pantalla de inicio</b>.</li><li>Se entra igual, con el usuario del ERP. Las mejoras llegan solas, sin reinstalar.</li></ul>' +
      '<h3>Si algo no carga</h3><ul><li>Apretá <b>Ctrl + F5</b> (en el celular: menú ⋮ → recargar).</li><li>Si dice que la sesión venció: <b>Salir</b> y volver a entrar.</li><li>«Conectar» (Calistenia): se autoriza una sola vez con tu usuario del ERP para leer datos en vivo.</li></ul>' +
      '<h3>Cuidado de la información</h3><ul><li>No compartas tu usuario ni la pantalla con personas ajenas. Los datos de clientes son privados.</li><li>Nunca pegues contraseñas ni claves en chats.</li></ul>' },
    { id: "atencion", titulo: "Atención al Cliente (ATC)", rol: "Atención al Cliente · CM", permisos: ["atencion", "atc"], html:
      '<h3>Tu trabajo del día</h3><ol><li>Entrá a <b>Atención al Cliente (ATC)</b>. La primera vez quedás sola en tu sucursal.</li><li>Arriba ves cuántos contactos llevás hoy y <b>lo que llevás ganado</b> hasta el corte del <b>25</b>.</li><li>En <b>Pendientes</b> está tu lista. Se ven 10 clientes; al bajar se cargan solos los 10 siguientes (o tocá <b>Ver 10 más</b>). Cada cliente trae su <b>correo</b> del ERP cuando lo tiene: el botón <b>Correo</b> abre tu correo con el mensaje listo. Si falta, tocá «+ Agregar correo» y guardalo. Cuando terminás tu lista, <b>se te carga sola la tanda siguiente</b> de tu sucursal (los próximos clientes de los grupos que eligió la Jefa, en orden de prioridad). Si ya no quedan, te avisa para que le pidas más. Por cada cliente: <b>Llamar</b> primero; si no atiende, <b>WhatsApp</b> (el mensaje ya va escrito con su nombre).</li><li>Usá el <b>Guion de la llamada</b>: saludo, conexión, oferta y cierre con dos opciones. Tiene respuestas para «lo voy a pensar», «no tengo tiempo» y «está caro».</li><li>Después de cada contacto, marcá <b>¿Cómo te fue?</b>. «Lo va a pensar» vuelve en 2 días; «Sin respuesta», al día siguiente.</li></ol>' +
      '<h3>Tus comisiones</h3><ul><li><b>Bs 5 por cada cliente que compra</b> dentro de los 15 días de tu último contacto. Sin tope.</li><li>«Compró o va a pagar» suma como <b>por confirmar</b>; se confirma cuando la venta se cobra en caja.</li><li>Se cobra todo lo confirmado del <b>26 al 25</b>. Si tenés meta, ves cuánto te falta y cuántas por día.</li><li>Si un cliente ya tenía plan activo antes de tu contacto, marcá «Ya estaba activo» y seguí con el siguiente.</li><li>Un contacto marcado <b>«Número equivocado»</b> no cuenta para la comisión: si después el cliente compra, la comisión es de la ATC que sí habló con él dentro de los 15 días (si no hubo otra, no es de nadie).</li></ul>' +
      '<h3>Reglas</h3><ul><li>Solo se vende el <b>paquete exclusivo</b> de la campaña a los clientes de tu lista. Las ventas a otras personas aparecen en el control de caja.</li><li>Si el cliente pide no ser contactado o el número está mal: «No contactar».</li><li>Si te quedás sin lista, avisá a tu Jefe de ATC.</li></ul>' },
    { id: "jefe_atc", titulo: "Jefe de ATC", rol: "Jefe de ATC · CM", permisos: ["jefe_atc"], html:
      '<h3>Cada mañana</h3><ol><li><b>Panel</b>: contactos de hoy, ventas de la semana, comisiones por pagar y cómo va cada chica (quién no tiene actividad).</li><li><b>Plan de hoy</b>: elegí los grupos de exclientes (vencieron hace poco, pases, cumpleaños, etc.), revisá la promoción y el mensaje, y <b>asigná las listas</b>: en cada sucursal hay un botón <b>«Dar lista a …»</b> por cada ATC (cada una con su clic), o «Asignar a todas». Podés fijar un <b>paquete exclusivo</b> de campaña.</li><li><b>Clientes que no adquirieron paquetes o no respondieron</b> (grupo 1 del Plan de hoy): los que una ATC ya contactó hace más de 15 días —el plazo de la comisión— y siguen sin plan. Muestra quién los contactó, cuándo y qué respondieron. Se asignan como cualquier otro grupo, con su propia promo y mensaje.</li><li><b>Cola automática</b>: los clientes de los grupos tildados que no entran en las listas quedan en cola por sucursal, en el mismo orden. Cuando una ATC termina, se le carga sola la tanda siguiente (del tamaño de la lista). Los clientes contactados en los últimos 15 días no se repiten. Cada vez que asignás de nuevo, la cola de esa sucursal se reemplaza.</li><li>Dejá una <b>nota del día</b> para el equipo.</li></ol>' +
      '<h3>Durante el día</h3><ul><li><b>Ver una lista</b>: mirá la lista de cualquier chica como la ve ella. Desde ahí podés <b>quitar un cliente</b>, <b>pasarlo a otra ATC</b> o <b>quitar la lista de una sucursal</b> asignada por error.</li><li>Dejá el <b>Panel</b> abierto: así se confirman las ventas con el registro de caja y a las chicas les llega su «¡Se cerró!».</li></ul>' +
      '<h3>Equipo, metas y pagos</h3><ul><li><b>Equipo</b>: cada ATC aparece al entrar por primera vez. Editá su sucursal y su <b>meta mensual</b>. La <b>planilla</b> ubica sola a cada ATC en su sucursal por su nombre.</li><li><b>Comisiones</b> y <b>Campañas</b>: lo ganado por chica, pagos («Marcar pagado») y el control de caja del paquete exclusivo.</li><li>Tareas y guiones: en «Más…».</li></ul>' +
      '<h3>Mi atención directa · Seguimiento de clientes</h3><ul><li>Los clientes que <b>todavía tienen plan</b> (vencen hoy o mañana, vencen en la semana, pagaron y no vinieron, 14 días o más sin venir) <b>no se reparten a las ATC</b>: los atendés vos.</li><li><b>Abrir lista</b> → «Promo y paquete exclusivo»: cargá la promo y, si querés, un <b>paquete exclusivo</b> del ERP. Al guardar, los clientes de la lista quedan habilitados para comprarlo en la sucursal (se controla en <b>Campañas</b>).</li><li>Cada lista se puede ver <b>por sucursal</b> (botones con la sucursal en cada tarjeta, o el selector «Sucursal»). El aviso «Berea tiene el …% de sus clientes activos sin venir» abre directo esos clientes.</li><li>Arriba de cada lista escribí <b>un mensaje para toda la lista</b> (empieza vacío) y guardalo. <b>No pongas el nombre</b>: el sistema saluda a cada cliente con el suyo («Hola, ¿cómo estás?» → «Hola Ana, ¿cómo estás?»).</li><li>En cada cliente ves cómo le llega; tocá <b>WhatsApp</b> para enviarlo, o <b>Llamar</b>, y después marcá <b>cómo te fue</b>. Si no renueva o lo va a pensar, marcá el <b>por qué</b> y anotá lo que te contó de su experiencia.</li><li>Arriba, el <b>contador del mes</b>: atendidos hoy y en el mes, cuántos respondieron, <b>cuántos renovaron</b> (con %), cuánto suman esas renovaciones y cuántos con el paquete exclusivo. Cada tarjeta dice cuántos atendiste y cuántos renovaron este mes.</li><li><b>Cómo nos fue</b> (este mes, mes anterior, 7, 30 o 90 días): la lista de <b>quiénes renovaron</b> y el botón <b>Descargar reporte</b> (Excel con cada contacto, su resultado y su compra). También: cuántos atendiste, cuántos respondieron, cuántos <b>compraron</b> (según las ventas del ERP, dentro de los 30 días), con qué paquete, los motivos y lo que cuentan los clientes.</li><li>Paraguay: las listas de «no vinieron» se llenan cuando llegue la asistencia del ERP de Paraguay.</li></ul>' },
    { id: "direccion", titulo: "Dirección", rol: "Dirección · CM", permisos: ["direccion"], html:
      '<h3>Qué mirar</h3><ul><li><b>Dirección</b>: semáforo por área y de fiscalización, proyección del mes.</li><li><b>Muro</b>: las pantallas en vivo (ver «Muro»).</li><li><b>Ventas ATC</b> (pantalla 7 del muro): quién trabaja y quién no, conversión por lista y por canal.</li></ul>' +
      '<h3>Configurar</h3><ul><li>Roles y permisos: se dan en el ERP (página /centro_mando). Cada rol tiene su texto de manual: copialo desde «Texto para el perfil del ERP» al final de cada sección.</li><li>Cámaras: en el muro, pantalla 0 → <b>Configurar</b> → dirección del puente.</li></ul>' },
    { id: "referidos", titulo: "Mis referidos (todo el equipo)", rol: null, permisos: null, html:
      '<h3>Para cada trabajador</h3><ol><li>Entrá a <b>calisteniabolivia-srl.github.io/dashboard/referidos.html</b> con tu usuario y contraseña del ERP (no hace falta ningún permiso especial).</li><li>La primera vez, creá tu código: tu carnet, tu celular y los de tu familia (los familiares no pueden usar tu código).</li><li>Compartí tu link o tu QR por WhatsApp. La persona se anota con su carnet y celular <b>antes</b> de pagar su paquete en caja o en la app.</li><li>Solo cuentan <b>clientes nuevos</b> (sin compras antes de anotarse). Cada cliente queda con el primer código que usó.</li><li>Ganás cuando el cliente paga. Si la venta se anula, la comisión se revierte; si ya te la habían pagado, se descuenta de tu próximo pago.</li><li>Se paga al corte del 25, junto con los bonos por cantidad de cierres.</li></ol>' +
      '<h3>Para Dirección y Administración</h3><ul><li>En la pestaña <b>Administración</b>: «Actualizar ahora» cruza con el ERP (inscripciones, compras, pagos y anulaciones). Se actualiza sola al abrirla.</li><li><b>Configuración</b>: porcentaje global y por paquete, meta y bonos. Lo ya ganado no cambia.</li><li><b>Liquidación</b>: «Pagado» marca las comisiones como pagadas y descuenta lo anulado después de pagarse.</li><li><b>Alertas</b>: código propio, familiar, cliente que ya compraba, código repetido y apellidos iguales.</li></ul>' },
    { id: "accionistas", titulo: "Accionistas e inversionistas", rol: "Accionistas · CM", permisos: ["accionistas"], html:
      '<ul><li><b>Ingresos en vivo</b>: ingresos de hoy, de la semana y del mes, con los cierres semanales y mensuales y la comparación con meses anteriores. Se actualiza solo cada 8 segundos.</li><li>Bolivia y Paraguay: elegí el país al entrar; cada uno muestra sus datos y su moneda.</li><li><b>Asistente Capital Corp</b>: preguntale por voz lo que quieras saber de los ingresos.</li><li>Este perfil ve solo ingresos: no muestra clientes, listas ni datos del personal.</li></ul>' },
    { id: "muro", titulo: "Muro y asistente «Capital Corp»", rol: "Muro · CM", permisos: ["muro"], html:
      '<h3>Pantallas del muro</h3><ul><li>Teclas <b>1 a 9 y 0</b> cambian de pantalla: Resumen, Ventas, Sucursales, Paquetes y cajeros, Asistencia hoy, Asistencia 30 días (horas buenas y bajas por sucursal), <b>Ventas ATC</b>, Retención, Caja y molinetes, <b>Cámaras</b>.</li><li><b>Cámaras</b>: todas las sucursales girando solas; se puede pausar o elegir una sucursal. Solo se ven desde equipos con Tailscale de la empresa.</li><li><b>Pantalla completa</b>: botón arriba a la derecha.</li></ul>' +
      '<h3>Asistente «Capital Corp»</h3><ul><li>Se conversa como con una persona: tocar <b>Conversar</b> (o la barra espaciadora) y hablarle normal. Respete las pausas, no corta a la mitad de una frase.</li><li>Responde con voz y con los datos reales del ERP (ventas, asistencia de hoy, clientes por vencer y vencidos), de Bolivia o de Paraguay según el país elegido.</li><li>Si uno le habla mientras responde, se calla y escucha.</li><li>Tras 2 minutos sin hablar se pone en espera; para volver: decir <b>«Capital…»</b> o tocar Conversar.</li><li>«Modo clásico» abre el asistente anterior (por si falla la conexión).</li><li>Equipo nuevo del muro: descargar la <b>autorización</b> una sola vez (micrófono, cámara y sonido).</li></ul>' },
    { id: "administracion", titulo: "Administración", rol: "Administración · CM", permisos: ["administracion"], html:
      '<ul><li>Cajas, control de ingreso, molinetes y sucursales.</li><li><b>Comisiones de los ATC</b>: lo que ganó cada ATC y el <b>control de caja</b> del paquete exclusivo (ventas a personas fuera de la lista).</li><li>Al abrir esa sección también se confirman las ventas de las ATC con el registro de caja.</li></ul>' },
    { id: "contabilidad", titulo: "Contabilidad y fiscalización", rol: "Contabilidad · CM", permisos: ["contabilidad"], html:
      '<ul><li>Caja contra banco, precios, NIT, convenios y prórrogas.</li><li>Revisá las alertas del día y anotá lo que requiere corrección en el ERP.</li></ul>' },
    { id: "tareas", titulo: "Tareas de Administración", rol: "Administración · Dirección", permisos: ["administracion", "direccion"], html:
      '<ul><li>Entrá desde la tarjeta <b>Tareas de Administración</b> o desde la franja de arriba en los tableros de Administración y Dirección (muestra urgentes, pendientes, vencidas y las que esperan decisión).</li><li><b>+ Nueva tarea</b>: qué hay que hacer, la <b>prioridad</b> (Urgente · Alta: esta semana · Media: este mes · Baja: cuando se pueda), sucursal, responsable, fecha límite y, si hace falta, los <b>pasos</b> (uno por línea) para tildarlos de a uno.</li><li>Cuando se termina, tildá la tarea: queda <b>hecha</b> con la fecha y quién la hizo. Si te equivocaste, la destildás.</li><li>Marcá «Necesita una decisión de Dirección» cuando la tiene que aprobar el director. Dirección lo ve, deja su <b>comentario o decisión</b> en la tarea y puede cambiar la prioridad.</li><li>Las tareas vencidas se marcan en rojo. Lo que ya no corresponde se <b>archiva</b>.</li></ul>' },
    { id: "mantenimiento", titulo: "Mantenimiento", rol: "Mantenimiento · CM", permisos: ["mantenimiento", "administracion", "supervision", "direccion"], html:
      '<h3>Revisar una sucursal (persona de mantenimiento)</h3><ol><li>Entrá a <b>Mantenimiento</b> → <b>Nueva revisión</b> y elegí la sucursal.</li><li>Recorré cada área y marcá cada punto: <b>Bien</b>, <b>Falla</b> o <b>No aplica</b>. Para ir rápido: «Marcar como Bien lo que falta» del área, y después cambiá lo que tenga falla.</li><li>En cada falla elegí la urgencia (urgente, esta semana o puede esperar) y escribí qué pasa.</li><li>Tocá <b>Guardar y enviar al administrador</b>. El reporte queda en el centro de mando y podés mandarlo por <b>WhatsApp</b> al administrador con un toque.</li><li>Si se corta el internet en la sucursal, el avance no se pierde: queda guardado en el celular.</li></ol>' +
      '<h3>Administración</h3><ul><li><b>Fallas pendientes</b>: todas las fallas abiertas, urgentes primero, con los días que llevan. Cuando se arregla, <b>Marcar arreglada</b> y contá cómo se arregló.</li><li><b>Reportes</b>: revisiones del mes, sucursales sin revisar (lo ideal es una vez por semana), tiempo promedio para arreglar y el detalle de cada revisión. Se descarga en Excel.</li><li><b>Checklist y aviso</b>: el número de WhatsApp al que llega el reporte y los puntos del checklist (agregar, quitar o cambiar).</li></ul>' },
    { id: "supervision", titulo: "Supervisores", rol: "Supervisión · CM", permisos: ["supervision"], html:
      '<ul><li>Sucursales, molinetes y clientes en riesgo.</li><li><b>Horas buenas y horas bajas</b> por sucursal: para planificar personal y promociones de horario.</li><li>«¿Cuántos días vino cada cliente?»: los que vienen 4 días o menos al mes se pasan a Atención al Cliente.</li></ul>' +
      '<h3>Calificación de entrenadores</h3><ol><li>En cada visita a una sucursal entrá a <b>Calificación de entrenadores</b> → <b>Calificar una clase</b>.</li><li>Elegí la <b>sucursal</b> y el <b>entrenador</b> que estás viendo (la lista se completa sola con los entrenadores del ERP y los ya calificados), la hora y el tipo de clase.</li><li>Calificá del <b>1 al 5</b> cada aspecto: estructura de la clase, tipo de entrenamiento, calidad técnica, atención al cliente, seguridad, energía, puntualidad y presentación, y orden de la sala.</li><li>Escribí lo que hace bien, lo que tiene que mejorar y lo que acordaron; marcá si le diste la devolución.</li><li><b>Ranking de entrenadores</b>: promedio general y por aspecto, tendencia, por sucursal y quiénes no fueron evaluados. Tocá un entrenador para ver todas sus visitas. Se descarga en Excel.</li></ol>' +
      '<h3>Reemplazo de profesores</h3><ol><li>Entrá a <b>Reemplazo de profesores</b> y tocá <b>+ Registrar reemplazo</b> el mismo día.</li><li>Cargá fecha, sucursal, horario, clases cubiertas, <b>quién faltó</b>, <b>quién lo reemplazó</b>, el motivo y si <b>avisó</b> (con anticipación, el mismo día o sin aviso).</li><li>Si te equivocaste: <b>Editar</b> o <b>Anular</b> (no se borra).</li><li>A fin de mes: el resumen muestra quién faltó más, los «sin aviso» y las <b>clases cubiertas por cada profesor</b> para su pago. <b>Descargar Excel</b> para RRHH o Administración.</li></ol>' },
    { id: "marketing", titulo: "Marketing y redes sociales", rol: "Marketing · CM", permisos: ["marketing"], html:
      '<ul><li><b>Marketing y Ventas</b>: proyección, paquetes, campañas y horas vacías.</li><li><b>Redes sociales</b>: Facebook e Instagram responden solos; las críticas se calman y pasan a privado; los casos delicados quedan <b>para aprobar</b>. En conversaciones podés tomar el control, asignar y dejar notas.</li><li>TikTok: borradores para publicar a mano.</li></ul>' +
      '<h3>Conectar Instagram</h3><ol><li>Redes sociales → <b>Configuración</b> → elegí el país → <b>Conectar Instagram</b>.</li><li>Se abre Facebook: entrá con el usuario de Facebook que <b>administra la página vinculada al Instagram</b> de la empresa, elegí la página y su Instagram y aceptá los permisos.</li><li>Vuelve solo al centro de mando con el aviso «Instagram conectado». Marcá «Responder solos comentarios y mensajes directos» del país.</li><li>No hace falta portafolio comercial. El Instagram tiene que estar vinculado a una página de Facebook. Si cambian la contraseña o quitan los permisos, se vuelve a tocar el botón.</li></ol>' },
    { id: "rrhh", titulo: "Recursos Humanos", rol: "RRHH · CM", permisos: ["rrhh"], html:
      '<ul><li>Productividad de entrenadores y cumplimiento de cajeros.</li></ul>' },
    { id: "reportes", titulo: "Reportes", rol: "Reportes · CM", permisos: ["reportes"], html:
      '<ul><li>Control y auditoría: traspasos, paquetes eliminados, cambios de fecha, convenios y usuarios duplicados.</li><li>Todo lo raro se revisa con la sucursal y se deja anotado.</li></ul>' },
    { id: "legal", titulo: "Legal", rol: "Legal · CM", permisos: ["legal"], html:
      '<ul><li>Vencimientos de contratos y licencias por sucursal.</li><li>Procesos con su bitácora y calendario de plazos.</li></ul>' }
  ];
  var s = null;
  try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
  if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
  var t = s.tableros, todo = ["direccion", "muro", "administracion", "contabilidad", "atencion", "supervision", "marketing", "rrhh", "reportes", "legal", "jefe_atc"].every(function (x) { return t.indexOf(x) >= 0; });
  document.getElementById("cm-quien").textContent = s.nombre || "";
  var mias = M.filter(function (m) { return !m.permisos || m.permisos.some(function (p) { return t.indexOf(p) >= 0; }); });
  var dir = t.indexOf("direccion") >= 0;
  var idx = document.getElementById("mn-indice"), cuerpo = document.getElementById("mn-cuerpo");
  mias.forEach(function (m) {
    var a = document.createElement("a"); a.href = "#" + m.id; a.textContent = m.titulo; idx.appendChild(a);
    var sec = document.createElement("section"); sec.className = "mn-sec"; sec.id = m.id;
    var h = document.createElement("h2"); h.textContent = m.titulo; sec.appendChild(h);
    if (m.rol) { var p = document.createElement("p"); p.className = "mn-perfil"; p.innerHTML = "Perfil del ERP: <b></b> · permiso en /centro_mando: "; p.querySelector("b").textContent = m.rol;
      m.permisos.forEach(function (x, i) { var c = document.createElement("code"); c.textContent = x; if (i) p.appendChild(document.createTextNode(" o ")); p.appendChild(c); }); sec.appendChild(p); }
    var d = document.createElement("div"); d.innerHTML = m.html; sec.appendChild(d);
    /* Dirección: el texto listo para pegar en la descripción del rol en el ERP (así el manual queda escrito en cada perfil). */
    if (dir && m.rol) {
      var e = document.createElement("div"); e.className = "mn-erp";
      e.appendChild(document.createTextNode("Texto para el perfil del ERP («" + m.rol + "» → descripción):"));
      var ta = document.createElement("textarea"); ta.rows = 3; ta.readOnly = true;
      ta.value = "Centro de mando — " + m.titulo + ". Entra con tu usuario del ERP en calisteniabolivia-srl.github.io/dashboard. Manual de funciones y uso: " + BASE + "#" + m.id;
      var b = document.createElement("button"); b.type = "button"; b.textContent = "Copiar";
      b.onclick = function () { ta.select(); try { navigator.clipboard.writeText(ta.value).then(function () { b.textContent = "Copiado"; }); } catch (x) { document.execCommand("copy"); b.textContent = "Copiado"; } };
      e.appendChild(ta); e.appendChild(b); sec.appendChild(e);
    }
    cuerpo.appendChild(sec);
  });
  if (mias.length <= 1) { var v = document.createElement("p"); v.className = "mn-vacio"; v.textContent = "Tu usuario todavía no tiene un perfil del centro de mando en el ERP. Pedí a Dirección que te lo asigne."; cuerpo.appendChild(v); }
  if (todo) document.getElementById("mn-lede").textContent = "Tenés acceso a todo: ves el manual de todos los perfiles. Al final de cada uno está el texto para pegar en la descripción del rol en el ERP.";
  if (location.hash) { var x = document.getElementById(location.hash.slice(1)); if (x) setTimeout(function () { x.scrollIntoView(); }, 50); }
})();
