<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="cm-firebase.js?v=14"></script>
<script>
/* Directores, inversionistas y el muro (permisos muro, Dirección o «accionistas»), de Bolivia o Paraguay. */
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    var t = s.tableros.concat(s.tableros_py || []);
    if (!["muro", "direccion", "accionistas"].some(function (x) { return t.indexOf(x) >= 0; })) { location.replace("./?sin=muro"); return; }
    window.CM_USUARIO = s;
    if (window.CM_PAIS !== "paraguay" && window.CM && !window.CM.conSesion()) window.CM.iniciarSesion(location.pathname.split("/").pop() + location.search);
})();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #050506; color: #F3F4F5; font-family: "Saira", "Segoe UI", Roboto, Arial, sans-serif; }
  .jv { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(14px, 2.4vw, 40px); gap: 12px; }
  .jv-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .jv-top img { height: clamp(26px, 3.6vh, 46px); width: auto; }
  .jv-top a { color: #8D9299; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  .jv-top a:hover { color: #F3F4F5; }
  .jv-centro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, 1fr); gap: clamp(16px, 3vw, 48px); align-items: center; min-height: 0; }
  .jv-voz { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .jv-esfera { width: min(52vh, 40vw); aspect-ratio: 1; }
  .jv-esfera canvas { width: 100%; height: 100%; display: block; }
  .jv-estado { font-size: clamp(12px, 1vw, 16px); letter-spacing: .34em; text-transform: uppercase; color: #C4C8CE; }
  body[data-estado=hablando] .jv-estado { color: #FFFFFF; }
  body[data-estado=error] .jv-estado { color: #C76A62; }
  .jv-nota { margin: 0; color: #8D9299; font-size: 14px; text-align: center; max-width: 46ch; min-height: 1.4em; }
  .jv-log { max-height: 62vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 6px; border-left: 1px solid #25272B; padding-left: clamp(14px, 2vw, 28px); }
  .jv-l { margin: 0; line-height: 1.45; font-size: clamp(15px, 1.15vw, 20px); font-weight: 300; }
  .jv-l b { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #5C6168; font-weight: 600; margin-bottom: 2px; }
  .jv-l.is-yo span { color: #8D9299; }
  .jv-pie { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .jv-btn { font: inherit; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #F3F4F5; background: none; border: 1px solid #34373C; padding: 12px 22px; cursor: pointer; border-radius: 0; }
  .jv-btn:hover, .jv-btn:focus-visible { border-color: #C4C8CE; outline: none; }
  .jv-btn.is-fuerte { background: #F3F4F5; color: #050506; border-color: #F3F4F5; min-width: 180px; }
  .jv-btn.is-fuerte.is-on { background: none; color: #F3F4F5; }
  .jv-aviso { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #121315; border: 1px solid #C76A62; padding: 10px 16px; margin: 0; max-width: min(92vw, 640px); }
  @media (max-width: 820px) {
    .jv-centro { grid-template-columns: 1fr; }
    .jv-esfera { width: min(78vw, 360px); }
    .jv-log { border-left: 0; border-top: 1px solid #25272B; padding: 12px 0 0; max-height: 34vh; }
  }
</style>
<link rel="stylesheet" href="sobrio.css?v=6">
</head>
<body data-estado="espera">
<main class="jv">
  <header class="jv-top">
    <img src="../images/capital-corp-logo.png" alt="Capital Corp">
    <nav><a href="asistente.html">Modo clásico</a> · <a href="./">Centro de mando</a></nav>
  </header>
  <section class="jv-centro">
    <div class="jv-voz">
      <div class="jv-esfera"><canvas id="jv-esfera" aria-hidden="true"></canvas></div>
      <div class="jv-estado" id="jv-estado" role="status" aria-live="polite">En espera</div>
      <p class="jv-nota" id="jv-nota"></p>
    </div>
    <div class="jv-log" id="jv-log" aria-live="polite" aria-label="Conversación"></div>
  </section>
  <footer class="jv-pie">
    <button type="button" class="jv-btn is-fuerte" id="jv-boton">Conversar</button>
    <button type="button" class="jv-btn" id="jv-mudo">Silenciar micrófono</button>
    <button type="button" class="jv-btn" id="jv-full">Pantalla completa</button>
  </footer>
</main>
<p class="jv-aviso" id="jv-aviso" role="alert" hidden></p>
<script src="jarvis.js?v=1"></script>
</body>
</html>
