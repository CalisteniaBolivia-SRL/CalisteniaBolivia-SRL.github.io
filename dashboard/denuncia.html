<head>

<title>Denuncia anónima · Calistenia Company</title>

<link rel="stylesheet" href="tablero-base.css?v=1">

<script src="pais.js?v=7"></script>
<!-- Solo la base de datos: sin el módulo de inicio de sesión, la denuncia nunca viaja con el usuario de quien la hace. -->

<body>
<main class="op dn" lang="es">
  <header class="op-top">
    <div>
      <span class="op-eyebrow">Calistenia Company · Bolivia · Recursos Humanos</span>
      <h1 class="op-titulo">Denuncia anónima</h1>
      <p class="op-muted">Para el personal: contá lo que pasó sin decir quién sos. La denuncia le llega solo a Recursos Humanos (o solo a Dirección, si lo elegís). No te pedimos usuario, nombre ni teléfono, y el sistema no guarda quién la envía.</p>
    </div>
  </header>
  <nav class="op-tabs" id="dn-tabs" role="tablist" aria-label="Secciones">
    <button type="button" role="tab" data-v="nueva" class="is-on" aria-selected="true">Hacer una denuncia</button>
    <button type="button" role="tab" data-v="seguir" aria-selected="false">Ver mi denuncia</button>
  </nav>
  <p class="op-msg" id="op-estado" role="status" aria-live="polite"></p>
  <div id="dn-vista"></div>
</main>
<script src="denuncia.js?v=1"></script>
