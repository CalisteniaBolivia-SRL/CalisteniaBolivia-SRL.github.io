<script>
/* Supervisores (su ruta), Dirección y Administración (el avance). Siempre con el usuario del ERP. */
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    var py = /[?&]pais=paraguay\b/.test(location.search);
    var t = s.tableros.concat(py ? (s.tableros_py || []) : []);
    if (!["supervision", "direccion", "administracion"].some(function (x) { return t.indexOf(x) >= 0; })) { location.replace("./?sin=supervision"); return; }
    window.CM_USUARIO = s;
    if (!py && window.CM && !window.CM.conSesion()) window.CM.iniciarSesion(location.pathname.split("/").pop() + location.search);
})();
</script>
