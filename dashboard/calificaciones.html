<script>
/* Supervisión califica a los entrenadores en sus visitas; Dirección, RRHH y Administración consultan. Siempre con el usuario del ERP. */
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    var t = s.tableros.concat(s.tableros_py || []);
    if (!["supervision", "direccion", "rrhh", "administracion"].some(function (x) { return t.indexOf(x) >= 0; })) { location.replace("./?sin=supervision"); return; }
    window.CM_USUARIO = s;
})();
</script>

      <p class="op-muted">En cada visita a una sucursal, el supervisor elige al entrenador que está viendo y lo califica del 1 al 5 en cada aspecto de la clase. Así se ve quién está mejor, quién necesita apoyo y en qué.</p>
