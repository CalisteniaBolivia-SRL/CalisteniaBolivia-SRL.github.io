<script>
/* Mantenimiento: la persona de mantenimiento (permiso «mantenimiento»), Supervisión y Administración cargan revisiones;
   Administración y Dirección reciben los reportes y cierran las fallas. Siempre con el usuario del ERP, de Bolivia o de Paraguay. */
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    var t = s.tableros.concat(s.tableros_py || []);
    if (!["mantenimiento", "administracion", "supervision", "direccion"].some(function (x) { return t.indexOf(x) >= 0; })) { location.replace("./?sin=mantenimiento"); return; }
    window.CM_USUARIO = s;
})();
</script>
