<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Roles · Calistenia Company</title>
<link rel="icon" href="../images/132458707.png">
<link rel="stylesheet" href="tablero-base.css?v=1">
<link rel="stylesheet" href="legal.css?v=1">
<script src="cm-mcp.js?v=2"></script>
<script>
(function () {
    var s = null;
    try { s = JSON.parse(localStorage.getItem("cb_centro_mando") || "null"); } catch (e) {}
    if (!s || !(s.vence > Date.now()) || !Array.isArray(s.tableros)) { location.replace("./"); return; }
    window.CM_USUARIO = s;
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=1"></script>
<script src="cm-firebase.js?v=1"></script>
</head>
<body>
<div class="cm-barra"><a href="./">← Centro de mando</a><span class="cm-quien" id="cm-quien"></span><button type="button" id="cm-salir">Salir</button></div>
<main class="lg" id="roles" lang="es">
  <header class="lg-top">
    <div>
      <span class="lg-eyebrow">Calistenia Company · Centro de mando</span>
      <h1 class="lg-title">Roles</h1>
      <p class="lg-muted">Quién puede usar cada módulo nuevo. Cada persona entra con su cuenta de Google; aquí se registra su correo y los módulos que ve. Solo Dirección puede cambiar esta lista.</p>
    </div>
  </header>
  <p class="lg-msg" id="rl-estado" role="status" aria-live="polite">Cargando…</p>
  <p class="lg-msg" id="rl-aviso" role="status" aria-live="polite"></p>
  <section id="rl-contenido"></section>
</main>
<script src="roles.js?v=1"></script>
<script>
(function () {
    var q = document.getElementById("cm-quien");
    if (q && window.CM_USUARIO) q.textContent = "Hola, " + window.CM_USUARIO.nombre;
    var salir = document.getElementById("cm-salir");
    if (salir) salir.onclick = function () { if (window.CM) window.CM.cerrarSesion(); try { localStorage.removeItem("cb_centro_mando"); } catch (e) {} location.href = "./"; };
})();
</script>
</body>
</html>
